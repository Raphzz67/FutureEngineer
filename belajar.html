<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="desain.css">
    <title>Login - Landing Page</title>
</head>
<body>
    <nav class="wrapper">
        <div class="brand">
            <div class="firstname">wiwok detok</div>
            <div class="lastname">tutorial</div>
        </div>
        <ul class="navigation">
            <li><a href="/">home</a></li>
            <li><a href="testing.jpeg" class="active">belajar</a></li>
            <li><a href="https://youtu.be/dQw4w9WgXcQ?si=FaQMZMPNFydd0mNg">tentang</a></li>
            <li><a href="/">kontak</a></li>
            <li><img src="tes.jpg" alt="profil"></li>
        </ul>
    </nav>

    <main class="hero">
        <form class="login" action="login.php" method="POST">
            <h2>Login</h2>
            
            <input type="text" name="username" placeholder="Masukkan Username" required autocomplete="username">
            
            <input type="password" name="password" id="password" placeholder="Masukkan Password" required autocomplete="current-password">
            
            <div class="checkbox-group">
                <input type="checkbox" id="show-password" onclick="togglePassword()">
                <label for="show-password">Tampilkan Password</label>
            </div>
            
            <button type="submit" name="submit">Log In</button>
            
            <p>Belum punya akun? <a href="register.html">Sign Up</a></p>
        </form>
    </main>

    <script>
        function togglePassword() {
            var pass = document.getElementById('password');
            var checkbox = document.getElementById('show-password');
            pass.type = checkbox.checked ? 'text' : 'password';
        }
    </script>
</body>
</html>
